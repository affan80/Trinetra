apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: api:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://osint-redis:6379/0"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "osint-kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: trinetra-api-service
spec:
  selector:
    app: trinetra-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
