apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: api:latest
        command: ["uvicorn", "services.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
        env:
        - name: REDIS_URL
          value: "redis://trinetra-redis:6379/0"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "osint-kafka:9092"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: trinetra-secrets
              key: openai-api-key
              optional: true
        - name: OPENAI_VERIFIER_MODEL
          value: "gpt-5"
---
apiVersion: v1
kind: Service
metadata:
  name: trinetra-api-service
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
