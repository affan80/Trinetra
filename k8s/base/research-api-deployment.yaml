apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-api
  template:
    metadata:
      labels:
        app: research-api
    spec:
      containers:
        - name: research-api
          image: trinetra-api:latest
          command: ["uvicorn", "backend.realtime_api:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trinetra-secrets
                  key: openai-api-key
                  optional: true
            - name: OPENAI_VERIFIER_MODEL
              value: "gpt-5"
---
apiVersion: v1
kind: Service
metadata:
  name: trinetra-research-service
spec:
  selector:
    app: research-api
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
