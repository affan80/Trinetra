services:
  redis:
    image: redis:8-alpine
    container_name: osint_redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: osint_api
    command: uvicorn services.api_service.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      SCRAPLING_PARSER_ENABLED: ${SCRAPLING_PARSER_ENABLED:-true}
      SCRAPLING_FETCH_FALLBACK_ENABLED: ${SCRAPLING_FETCH_FALLBACK_ENABLED:-false}
      SCRAPLING_FETCH_MODE: ${SCRAPLING_FETCH_MODE:-static}
      SCRAPLING_BROWSER_ENABLED: ${SCRAPLING_BROWSER_ENABLED:-false}
      SCRAPLING_ADAPTIVE_ENABLED: ${SCRAPLING_ADAPTIVE_ENABLED:-false}
      SCRAPLING_TIMEOUT_MS: ${SCRAPLING_TIMEOUT_MS:-30000}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-50}
      DISCOVERY_TIMEOUT_SECONDS: ${DISCOVERY_TIMEOUT_SECONDS:-20}
      DISCOVERY_RATE_LIMIT_SECONDS: ${DISCOVERY_RATE_LIMIT_SECONDS:-0}
      FRONTIER_BATCH_SIZE: ${FRONTIER_BATCH_SIZE:-25}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SOURCE_REGISTRY_PATH: ${SOURCE_REGISTRY_PATH:-/app/config/scraper/source_registry.json}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    container_name: osint_alert_worker
    command: python -m services.worker_service.alert_worker
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      SCRAPLING_PARSER_ENABLED: ${SCRAPLING_PARSER_ENABLED:-true}
      SCRAPLING_FETCH_FALLBACK_ENABLED: ${SCRAPLING_FETCH_FALLBACK_ENABLED:-false}
      SCRAPLING_FETCH_MODE: ${SCRAPLING_FETCH_MODE:-static}
      SCRAPLING_BROWSER_ENABLED: ${SCRAPLING_BROWSER_ENABLED:-false}
      SCRAPLING_ADAPTIVE_ENABLED: ${SCRAPLING_ADAPTIVE_ENABLED:-false}
      SCRAPLING_TIMEOUT_MS: ${SCRAPLING_TIMEOUT_MS:-30000}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-50}
      DISCOVERY_TIMEOUT_SECONDS: ${DISCOVERY_TIMEOUT_SECONDS:-20}
      DISCOVERY_RATE_LIMIT_SECONDS: ${DISCOVERY_RATE_LIMIT_SECONDS:-0}
      FRONTIER_BATCH_SIZE: ${FRONTIER_BATCH_SIZE:-25}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SOURCE_REGISTRY_PATH: ${SOURCE_REGISTRY_PATH:-/app/config/scraper/source_registry.json}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  crawler:
    build: .
    container_name: osint_crawler
    command: scrapy crawl news
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      SCRAPLING_PARSER_ENABLED: ${SCRAPLING_PARSER_ENABLED:-true}
      SCRAPLING_FETCH_FALLBACK_ENABLED: ${SCRAPLING_FETCH_FALLBACK_ENABLED:-false}
      SCRAPLING_FETCH_MODE: ${SCRAPLING_FETCH_MODE:-static}
      SCRAPLING_BROWSER_ENABLED: ${SCRAPLING_BROWSER_ENABLED:-false}
      SCRAPLING_ADAPTIVE_ENABLED: ${SCRAPLING_ADAPTIVE_ENABLED:-false}
      SCRAPLING_TIMEOUT_MS: ${SCRAPLING_TIMEOUT_MS:-30000}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-50}
      DISCOVERY_TIMEOUT_SECONDS: ${DISCOVERY_TIMEOUT_SECONDS:-20}
      DISCOVERY_RATE_LIMIT_SECONDS: ${DISCOVERY_RATE_LIMIT_SECONDS:-0}
      FRONTIER_BATCH_SIZE: ${FRONTIER_BATCH_SIZE:-25}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SOURCE_REGISTRY_PATH: ${SOURCE_REGISTRY_PATH:-/app/config/scraper/source_registry.json}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - crawlers

volumes:
  redis_data:
