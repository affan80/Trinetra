services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: trinetra
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra -d trinetra"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  backend:
    image: trinetra-backend
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://trinetra:trinetra@postgres:5432/trinetra
      REDIS_URL: redis://redis:6379/0
      RAW_OBJECT_ROOT: /var/lib/trinetra/raw
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      API_V1_PREFIX: /api/v1
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["raw_data:/var/lib/trinetra/raw", "./artifacts:/app/artifacts:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery:
    image: trinetra-backend
    command: celery -A backend.app.workers.celery_app.celery_app worker --loglevel=INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://trinetra:trinetra@postgres:5432/trinetra
      RAW_OBJECT_ROOT: /var/lib/trinetra/raw
    volumes: ["raw_data:/var/lib/trinetra/raw"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  scheduler:
    image: trinetra-backend
    command: python -m backend.app.workers.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://trinetra:trinetra@postgres:5432/trinetra
    depends_on:
      postgres: {condition: service_healthy}
  collector:
    profiles: ["collection"]
    image: trinetra-backend
    command: ["python", "-m", "scripts.audit_source_registry", "--output", "artifacts/source_audit_live.json", "--object-root", "/var/lib/trinetra/raw", "--workers", "8", "--rss"]
    volumes: ["raw_data:/var/lib/trinetra/raw", "./artifacts:/app/artifacts"]
  frontend:
    build: frontend
    environment: {API_INTERNAL_URL: "http://backend:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  raw_data:
  # Retained for recovery of data from older MinIO-based development stacks.
  minio_data:
