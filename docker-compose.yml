services:
  redis:
    image: redis:8-alpine
    container_name: osint_redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: osint_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: osint_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  spark-master:
    image: bitnami/spark:3.5.0
    container_name: osint_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: osint_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master

  spark-processor:
    build: .
    container_name: osint_spark_processor
    command: python -m services.worker_service.spark_processor
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /app
    depends_on:
      kafka:
        condition: service_started
      spark-master:
        condition: service_started
    restart: unless-stopped

  api:
    build: .
    container_name: osint_api
    command: uvicorn services.api_service.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /app
      SCRAPLING_PARSER_ENABLED: ${SCRAPLING_PARSER_ENABLED:-true}
      SCRAPLING_FETCH_FALLBACK_ENABLED: ${SCRAPLING_FETCH_FALLBACK_ENABLED:-false}
      SCRAPLING_FETCH_MODE: ${SCRAPLING_FETCH_MODE:-static}
      SCRAPLING_BROWSER_ENABLED: ${SCRAPLING_BROWSER_ENABLED:-false}
      SCRAPLING_ADAPTIVE_ENABLED: ${SCRAPLING_ADAPTIVE_ENABLED:-false}
      SCRAPLING_TIMEOUT_MS: ${SCRAPLING_TIMEOUT_MS:-30000}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-50}
      DISCOVERY_TIMEOUT_SECONDS: ${DISCOVERY_TIMEOUT_SECONDS:-20}
      DISCOVERY_RATE_LIMIT_SECONDS: ${DISCOVERY_RATE_LIMIT_SECONDS:-0}
      FRONTIER_BATCH_SIZE: ${FRONTIER_BATCH_SIZE:-25}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SOURCE_REGISTRY_PATH: ${SOURCE_REGISTRY_PATH:-/app/config/scraper/source_registry.json}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    container_name: osint_alert_worker
    command: python -m services.worker_service.alert_worker
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /app
      SCRAPLING_PARSER_ENABLED: ${SCRAPLING_PARSER_ENABLED:-true}
      SCRAPLING_FETCH_FALLBACK_ENABLED: ${SCRAPLING_FETCH_FALLBACK_ENABLED:-false}
      SCRAPLING_FETCH_MODE: ${SCRAPLING_FETCH_MODE:-static}
      SCRAPLING_BROWSER_ENABLED: ${SCRAPLING_BROWSER_ENABLED:-false}
      SCRAPLING_ADAPTIVE_ENABLED: ${SCRAPLING_ADAPTIVE_ENABLED:-false}
      SCRAPLING_TIMEOUT_MS: ${SCRAPLING_TIMEOUT_MS:-30000}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-50}
      DISCOVERY_TIMEOUT_SECONDS: ${DISCOVERY_TIMEOUT_SECONDS:-20}
      DISCOVERY_RATE_LIMIT_SECONDS: ${DISCOVERY_RATE_LIMIT_SECONDS:-0}
      FRONTIER_BATCH_SIZE: ${FRONTIER_BATCH_SIZE:-25}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SOURCE_REGISTRY_PATH: ${SOURCE_REGISTRY_PATH:-/app/config/scraper/source_registry.json}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  crawler:
    build: .
    container_name: osint_crawler
    command: scrapy crawl news
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /app
      SCRAPLING_PARSER_ENABLED: ${SCRAPLING_PARSER_ENABLED:-true}
      SCRAPLING_FETCH_FALLBACK_ENABLED: ${SCRAPLING_FETCH_FALLBACK_ENABLED:-false}
      SCRAPLING_FETCH_MODE: ${SCRAPLING_FETCH_MODE:-static}
      SCRAPLING_BROWSER_ENABLED: ${SCRAPLING_BROWSER_ENABLED:-false}
      SCRAPLING_ADAPTIVE_ENABLED: ${SCRAPLING_ADAPTIVE_ENABLED:-false}
      SCRAPLING_TIMEOUT_MS: ${SCRAPLING_TIMEOUT_MS:-30000}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-50}
      DISCOVERY_TIMEOUT_SECONDS: ${DISCOVERY_TIMEOUT_SECONDS:-20}
      DISCOVERY_RATE_LIMIT_SECONDS: ${DISCOVERY_RATE_LIMIT_SECONDS:-0}
      FRONTIER_BATCH_SIZE: ${FRONTIER_BATCH_SIZE:-25}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SOURCE_REGISTRY_PATH: ${SOURCE_REGISTRY_PATH:-/app/config/scraper/source_registry.json}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    profiles:
      - crawlers

volumes:
  redis_data:
