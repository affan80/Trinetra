services:

  redis:
    image: redis:8-alpine
    container_name: osint_redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: osint_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: ruok,srvr
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 127.0.0.1 2181 | grep -E 'standalone|leader|follower'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: osint_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped


  spark-master:
    image: spark:3.5.3
    container_name: osint_spark_master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped


  spark-worker:
    image: spark:3.5.3
    container_name: osint_spark_worker
    user: root
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - spark_checkpoints:/app/data/spark-checkpoints
    restart: unless-stopped


  spark-processor:
    build: .
    container_name: osint_spark_processor
    user: root
    command: python -m services.processing.worker_service.spark_processor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PROCESSED: scraped_data_processed
      SPARK_CHECKPOINT_DIR: /app/data/spark-checkpoints
      SPARK_MASTER_URL: spark://spark-master:7077
      PYTHONPATH: /app
    volumes:
      - .:/app
      - spark_checkpoints:/app/data/spark-checkpoints
    depends_on:
      - kafka
      - spark-master
    restart: unless-stopped


  api:
    build: .
    container_name: osint_api
    command: ["uvicorn", "services.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VERIFIER_MODEL: ${OPENAI_VERIFIER_MODEL:-gpt-5}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  research-api:
    build: .
    container_name: osint_research_api
    command: ["uvicorn", "backend.realtime_api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VERIFIER_MODEL: ${OPENAI_VERIFIER_MODEL:-gpt-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRINETRA_UPLOAD_DIR: /app/data/realtime
      PYTHONPATH: /app
    volumes:
      - realtime_uploads:/app/data/realtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osint_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      research-api:
        condition: service_healthy
    restart: unless-stopped

  tui:
    build: .
    container_name: osint_tui
    command: ["python", "-m", "tui.app.main"]
    environment:
      TRINETRA_API_URL: http://api:8000
      TERM: xterm-256color
    stdin_open: true
    tty: true
    depends_on:
      api:
        condition: service_healthy


  worker:
    build: .
    container_name: osint_alert_worker
    command: python -m services.processing.worker_service.alert_worker
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /app
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped


  crawler:
    build: .
    container_name: osint_crawler
    command: scrapy crawl news
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /app
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # A crawl is a bounded batch job. Do not relaunch a successfully completed
    # crawl indefinitely; restart only when it fails.
    restart: on-failure


  postgis:
    image: postgis/postgis:16-3.4
    container_name: osint_postgis
    environment:
      POSTGRES_USER: osint_user
      POSTGRES_PASSWORD: osint_password
      POSTGRES_DB: osint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  neo4j:
    image: neo4j:5.26
    container_name: osint_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    restart: unless-stopped


  minio:
    image: minio/minio
    container_name: osint_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped


volumes:
  redis_data:
  spark_checkpoints:
  minio_data:
  postgres_data:
  neo4j_data:
  realtime_uploads:
