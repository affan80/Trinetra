services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: trinetra
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra -d trinetra"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trinetra
      MINIO_ROOT_PASSWORD: change-me-in-development
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://trinetra:trinetra@postgres:5432/trinetra
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: trinetra
      MINIO_SECRET_KEY: change-me-in-development
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      API_V1_PREFIX: /api/v1
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: celery -A backend.app.workers.celery_app.celery_app worker --loglevel=INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://trinetra:trinetra@postgres:5432/trinetra
    depends_on: [redis, postgres]
  scheduler:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python -m backend.app.workers.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://trinetra:trinetra@postgres:5432/trinetra
    depends_on: [postgres]
  frontend:
    build: frontend
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  minio_data:
